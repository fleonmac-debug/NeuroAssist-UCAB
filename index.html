<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroAssist - Asistente Virtual UCAB</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #004664; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; }
        .header { text-align: center; margin-bottom: 20px; }
        .logo-ucab { width: 200px; filter: brightness(0) invert(1); } /* Logo arreglado */
        
        /* Contenedor del ASISTENTE VIRTUAL */
        .asistente-box { background: white; width: 90%; max-width: 500px; height: 500px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; color: #333; }
        .chat-header { background: #F2AD43; color: #004664; padding: 20px; font-weight: bold; text-align: center; font-size: 1.2em; border-bottom: 2px solid #d49632; }
        .chat-content { flex: 1; padding: 20px; overflow-y: auto; background: #f4f7f6; }
        .bot-msg { background: #e7f3f9; padding: 15px; border-radius: 15px; margin-bottom: 15px; border-left: 5px solid #004664; line-height: 1.4; }
        .user-options { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: white; }
        .opt-btn { background: #004664; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 0.9em; transition: 0.3s; }
        .opt-btn:hover { background: #F2AD43; color: #004664; }
        .footer-link { margin-top: 20px; color: #aaa; text-decoration: none; font-size: 0.8em; }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://moodle.ucab.edu.ve/theme/image.php/boost/theme/1715112108/logo_ucab_blanco" class="logo-ucab" alt="UCAB">
        <h1>NeuroAssist: Asistente Técnico</h1>
        <p>Consulta protocolos y procedimientos del Laboratorio</p>
    </div>

    <div class="asistente-box">
        <div class="chat-header">🤖 Interfaz de Consulta Inteligente</div>
        <div class="chat-content" id="chat">
            <div class="bot-msg">
                <b>¡Hola! Soy NeuroAssist.</b><br>
                He analizado tus documentos de protocolos. ¿En qué puedo ayudarte hoy?
            </div>
        </div>
        <div class="user-options">
            <button class="opt-btn" onclick="ask('lentes')">Protocolo Lentes</button>
            <button class="opt-btn" onclick="ask('rdc')">Requisitos RDC</button>
            <button class="opt-btn" onclick="ask('baseline')">Importancia Baseline</button>
            <button class="opt-btn" onclick="ask('emotiv')">Uso de Emotiv EEG</button>
        </div>
    </div>

    <a href="https://script.google.com/macros/s/AKfycbx6s2PQ6VwSSJvK28NLml_ZnuuZXRhQWH_Vtp-qZXIH17kLJ2Ftwgg3BiZ74ht8WoHT/exec" class="footer-link">Acceder al Sistema de Reservas →</a>

    <script>
        function ask(topic) {
            const chat = document.getElementById('chat');
            let res = "";
            if(topic==='lentes') res = "<b>Según el protocolo:</b> El uso de lentes con antirreflejo grueso dificulta la captura del Eye Tracker. Se recomienda que si el sujeto tiene una visión aceptable sin ellos, se los retire. Si no, se debe recalibrar hasta obtener un error menor a 0.5 grados.";
            if(topic==='rdc') res = "<b>Requisitos para Estudios Remotos:</b> Es obligatorio usar Chrome o Safari. La cámara debe ser de 720p y el sujeto debe estar en un ambiente iluminado de frente, nunca con luz de respaldo.";
            if(topic==='baseline') res = "<b>El Baseline es obligatorio:</b> Debes registrar 60 segundos de actividad en reposo antes de cualquier estímulo para poder normalizar los datos de GSR y Ritmo Cardíaco.";
            if(topic==='emotiv') res = "<b>Uso de Emotiv EEG:</b> Asegúrate de hidratar los sensores con solución salina. La conexión debe mostrar todos los nodos en verde en el software antes de empezar la grabación.";
            
            chat.innerHTML += `<div class="bot-msg">${res}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
