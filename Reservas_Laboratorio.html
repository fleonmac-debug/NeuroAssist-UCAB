<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio UCAB - Acceso Directo</title>

    <meta http-equiv="refresh" content="1.5; url=https://script.google.com/macros/s/AKfycbx6s2PQ6VwSSJvK28NLml_ZnuuZXRhQWH_Vtp-qZXIH17kLJ2Ftwgg3BiZ74ht8WoHT/exec" />
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: #333;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 5px solid #F2AD43; /* Dorado UCAB */
            max-width: 400px;
            width: 90%;
        }
        .logo-svg {
            width: 160px;
            height: auto;
            margin-bottom: 20px;
        }
        h2 { color: #004664; margin-bottom: 10px; } /* Azul UCAB */
        p { color: #666; font-size: 16px; margin-bottom: 30px; }
        
        /* Efecto de Carga Elegante */
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #004664;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .footer-text { font-size: 12px; color: #aaa; margin-top: 30px; }
        .manual-link { color: #F2AD43; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        
        <svg class="logo-svg" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
            <text x="100" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="900" fill="#004664" text-anchor="middle" letter-spacing="2">UCAB</text>
            <line x1="30" y1="65" x2="170" y2="65" stroke="#F2AD43" stroke-width="5" stroke-linecap="round"/>
        </svg>
        
        <h2>Conectando...</h2>
        <p>Estamos abriendo el Sistema de Reservas del Laboratorio.</p>
        
        <div class="loader"></div>
        
        <p class="footer-text">Si no redirige en unos segundos, 
           <a href="https://script.google.com/macros/s/AKfycbx6s2PQ6VwSSJvK28NLml_ZnuuZXRhQWH_Vtp-qZXIH17kLJ2Ftwgg3BiZ74ht8WoHT/exec" class="manual-link">haz clic aquí</a>.
        </p>
    </div>
</body>
</html>
